<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Temporal Misalignment — Visual Abstract</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    @page { size: 920px auto; margin: 0; }
    body {
      font-family: 'DejaVu Sans', Arial, sans-serif;
      background: #fff;
      color: #333333;
      display: flex;
      justify-content: center;
      padding: 28px 20px;
    }
    .figure {
      width: 880px;
      border: 1px solid #cccccc;
      padding: 22px 22px 18px;
    }
    .row { display: flex; flex-direction: column; gap: 10px; }
    .row + .row { border-top: 1px solid #cccccc; margin-top: 18px; padding-top: 18px; }
    .row-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #888888; }
    .panel-id { color: #333333; font-size: 11px; margin-right: 5px; }

    .row-content {
      display: grid;
      grid-template-columns: 400px 28px 210px 28px 1fr;
      align-items: center;
    }

    /* frame strip */
    .frames { display: flex; align-items: center; gap: 6px; }
    .frame-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .fn { font-size: 9px; color: #888888; font-variant-numeric: tabular-nums; }
    .fn.r { color: #d62728; font-weight: 700; }
    .fn.g { color: #2ca02c; font-weight: 700; }
    .frame-img {
      width: 88px;
      height: 66px;
      object-fit: cover;
      display: block;
      border: 1px solid #cccccc;
      flex-shrink: 0;
    }
    .frame-img.swap { border: 2px solid #d62728; }
    .frame-img.corr { border: 2px solid #2ca02c; }
    .fsep  { font-size: 11px; color: #cccccc; flex-shrink: 0; line-height: 1; margin-top: 18px; }
    .fswap { font-size: 11px; color: #d62728; font-weight: 700; flex-shrink: 0; line-height: 1; margin-top: 18px; }

    .arrow { text-align: center; font-size: 15px; color: #cccccc; }

    /* VLM col */
    .vlm-col { display: flex; flex-direction: column; align-items: center; }
    .thought {
      width: 200px;
      border: 1px solid #cccccc;
      background: white;
      padding: 6px 8px;
    }
    .mini-seq { display: flex; align-items: center; gap: 2px; justify-content: center; }
    .mf {
      width: 25px; height: 18px;
      border: 1px solid #cccccc;
      display: flex; align-items: center; justify-content: center;
      font-size: 9.5px; font-weight: 700; flex-shrink: 0; color: #888888;
    }
    .mf.r { color: #d62728;   border-color: #d62728;   background: rgba(214,39,40,0.06); }
    .mf.g { color: #2ca02c; border-color: #2ca02c; background: rgba(44,160,44,0.06); }
    .ma   { font-size: 8px; color: #cccccc; flex-shrink: 0; }
    .ma.r { color: #d62728; }
    .thought-note { font-size: 8.5px; color: #888888; font-style: italic; text-align: center; margin-top: 5px; }
    .thought-note.g { color: #2ca02c; }
    .connector { width: 1px; height: 5px; background: #cccccc; }
    .robot { font-size: 32px; line-height: 1; }

    /* chart fills the 1fr column */
    .charts-col img { display: block; width: 100%; height: auto; }
  </style>
</head>
